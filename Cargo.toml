[package]
name = "world-clock-widget"
version = "1.2.0"
edition = "2021"
description = "A tiny always-on desktop widget for Windows that shows up to five analog world clocks"
license = "MIT"
repository = "https://github.com/nihalkaler/world-clock-widget"
readme = "README.md"
keywords = ["clock", "timezone", "widget", "windows", "desktop"]
categories = ["date-and-time", "gui"]

[[bin]]
name = "world-clock"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3"
